<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logo J.A.V. — Loading</title>
<style>
  /* ===== Animação da logo J.A.V. (versão HTML/CSS/JS puro) ===== */
  @keyframes jav-draw    { from { stroke-dashoffset: 220; } to { stroke-dashoffset: 0; } }
  @keyframes jav-float   { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes jav-glow    { 0%,100% { filter: drop-shadow(0 0 6px rgba(59,130,246,.3)); }
                           50%     { filter: drop-shadow(0 0 22px rgba(59,130,246,.8)); } }
  @keyframes jav-bar     { from { width: 0; } to { width: 100%; } }
  @keyframes jav-dot-pop { 0%   { opacity: 0; transform: translateY(-12px) scale(.4); }
                           60%  { transform: translateY(3px) scale(1.15); }
                           100% { opacity: 1; transform: translateY(0) scale(1); } }

  .jav-overlay {
    position: fixed; inset: 0; z-index: 9999;
    background: radial-gradient(ellipse at 40% 40%, #060614 0%, #000 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px;
    font-family: system-ui, sans-serif;
  }
  .jav-logo-wrap { animation: jav-float 3.5s ease-in-out infinite 1.6s, jav-glow 2.8s ease-in-out infinite 1.6s; }

  /* Colchetes: desenhados via stroke-dash */
  .jav-bracket { stroke-dasharray: 220; stroke-dashoffset: 220; }
  .jav-f1 .jav-bracket-tl { animation: jav-draw .55s cubic-bezier(.4,0,.2,1) forwards; }
  .jav-f1 .jav-bracket-br { animation: jav-draw .55s cubic-bezier(.4,0,.2,1) .1s forwards; }

  /* Letras: entram com fade + deslocamento (efeito "mola") */
  .jav-letter { opacity: 0; transition: opacity .35s ease, transform .4s cubic-bezier(.34,1.56,.64,1); }
  .jav-j { transform: translateX(-30px); }
  .jav-a { transform: translateY(-20px); }
  .jav-v { transform: translateX(30px); }
  .jav-f2 .jav-j, .jav-f3 .jav-a, .jav-f4 .jav-v { opacity: 1; transform: none; }

  /* Pixels */
  .jav-pixel { opacity: 0; transform-box: fill-box; transform-origin: center; }
  .jav-f5 .jav-pixel { animation: jav-dot-pop .4s cubic-bezier(.34,1.56,.64,1) both; }

  /* Barra + mensagem */
  .jav-bottom { width: 260px; display: flex; flex-direction: column; gap: 10px; }
  .jav-track { width: 100%; height: 3px; background: rgba(255,255,255,.06); border-radius: 99px; overflow: hidden; }
  .jav-fill  { height: 100%; width: 0; border-radius: 99px;
               background: linear-gradient(90deg,#1d4ed8,#3b82f6,#60a5fa);
               box-shadow: 0 0 10px rgba(59,130,246,.7); }
  .jav-f1 .jav-fill { animation: jav-bar 1.7s cubic-bezier(.4,0,.2,1) forwards; }
  .jav-msg { text-align: center; font-size: 12px; color: rgba(255,255,255,.35); letter-spacing: .5px; }
</style>
</head>
<body style="margin:0;background:#000">

<div class="jav-overlay" id="jav-loading">
  <div class="jav-logo-wrap">
    <svg viewBox="15 8 300 285" width="230" height="230">
      <defs>
        <linearGradient id="jav-silver" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#c8c8c8"/><stop offset="40%" stop-color="#f0f0f0"/><stop offset="100%" stop-color="#888888"/>
        </linearGradient>
        <linearGradient id="jav-blue-v" x1="20%" y1="0%" x2="80%" y2="100%">
          <stop offset="0%" stop-color="#4f8ef7"/><stop offset="100%" stop-color="#1a3fcc"/>
        </linearGradient>
        <linearGradient id="jav-bracket-g" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#60a5fa"/><stop offset="100%" stop-color="#2563eb"/>
        </linearGradient>
        <linearGradient id="jav-ja-blend" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#d0d0d0"/><stop offset="60%" stop-color="#e8e8e8"/><stop offset="100%" stop-color="#aaaaaa"/>
        </linearGradient>
      </defs>

      <!-- Colchetes -->
      <path class="jav-bracket jav-bracket-tl" d="M 158,30 L 40,30 L 40,128"
            fill="none" stroke="url(#jav-bracket-g)" stroke-width="7" stroke-linecap="square"/>
      <path class="jav-bracket jav-bracket-br" d="M 160,280 L 290,280 L 290,180"
            fill="none" stroke="url(#jav-bracket-g)" stroke-width="7" stroke-linecap="square"/>

      <!-- J -->
      <g class="jav-letter jav-j">
        <line x1="74" y1="50" x2="114" y2="50" stroke="url(#jav-silver)" stroke-width="13" stroke-linecap="round"/>
        <line x1="104" y1="50" x2="104" y2="215" stroke="url(#jav-silver)" stroke-width="22" stroke-linecap="round"/>
        <path d="M 104,215 Q 104,260 78,260 Q 58,260 58,235" fill="none" stroke="url(#jav-silver)" stroke-width="22" stroke-linecap="round"/>
      </g>

      <!-- A (pico) -->
      <g class="jav-letter jav-a">
        <line x1="108" y1="252" x2="168" y2="50" stroke="url(#jav-silver)" stroke-width="22" stroke-linecap="round"/>
        <line x1="168" y1="50" x2="212" y2="165" stroke="url(#jav-ja-blend)" stroke-width="22" stroke-linecap="round"/>
      </g>

      <!-- V (azul) -->
      <g class="jav-letter jav-v">
        <line x1="210" y1="162" x2="236" y2="252" stroke="url(#jav-blue-v)" stroke-width="22" stroke-linecap="round"/>
        <line x1="236" y1="252" x2="272" y2="88" stroke="url(#jav-blue-v)" stroke-width="22" stroke-linecap="round"/>
      </g>

      <!-- Pixels -->
      <rect class="jav-pixel" x="232" y="34" width="14" height="14" rx="1" fill="#3b82f6" style="animation-delay:0ms"/>
      <rect class="jav-pixel" x="249" y="22" width="10" height="10" rx="1" fill="#3b82f6" style="animation-delay:80ms"/>
      <rect class="jav-pixel" x="250" y="40" width="7"  height="7"  rx="1" fill="#3b82f6" style="animation-delay:160ms"/>
      <rect class="jav-pixel" x="238" y="50" width="5"  height="5"  rx="1" fill="#3b82f6" style="animation-delay:240ms"/>
    </svg>
  </div>

  <div class="jav-bottom">
    <div class="jav-track"><div class="jav-fill"></div></div>
    <div class="jav-msg">Carregando...</div>
  </div>
</div>

<script>
  // Sequência de fases (mesmos tempos do sistema original)
  (function () {
    var el = document.getElementById('jav-loading');
    [[1, 100], [2, 500], [3, 750], [4, 950], [5, 1100]].forEach(function (f) {
      setTimeout(function () { el.classList.add('jav-f' + f[0]); }, f[1]);
    });
    // Para remover a tela quando seu sistema terminar de carregar:
    // document.getElementById('jav-loading').remove();
  })();
</script>
</body>
</html>
