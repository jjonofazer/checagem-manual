<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Mockup — Tela de Loading</title>
<style>
  /* ==========================================================================
     MOCKUP EDITÁVEL DA TELA DE LOADING
     Espelha Frontend/src/components/LoadingScreen.tsx — este arquivo é apenas
     para testar ajustes visuais. Editar aqui NÃO altera a tela real do sistema.
     Quando estiver satisfeito com o resultado, replique as mudanças manualmente
     no componente React (cores, tamanhos, tempos de animação etc.).
     ========================================================================== */

  :root {
    /* ---- CORES (edite aqui) ---- */
    --bg-inner: #060614;
    --bg-outer: #000000;

    --silver-1: #c8c8c8;
    --silver-2: #f0f0f0;
    --silver-3: #888888;

    --blue-v-1: #4f8ef7;
    --blue-v-2: #1a3fcc;

    --bracket-1: #60a5fa;
    --bracket-2: #2563eb;

    --ja-blend-1: #d0d0d0;
    --ja-blend-2: #e8e8e8;
    --ja-blend-3: #aaaaaa;

    --pixel-color: #3b82f6;

    --bar-track: rgba(255,255,255,.06);
    --bar-1: #1d4ed8;
    --bar-2: #3b82f6;
    --bar-3: #60a5fa;

    --texto-cor: rgba(255,255,255,.35);

    /* ---- TAMANHOS (edite aqui) ---- */
    --logo-size: 230px;
    --barra-largura: 260px;

    /* ---- TEMPOS (ms) — quando cada etapa aparece ---- */
    --t-brackets: 100;
    --t-j: 500;
    --t-a: 750;
    --t-v: 950;
    --t-pixels: 1250;

    /* Duração do preenchimento da barra */
    --dur-barra: 1.7s;

    /* Intervalo entre repetições do loop (só neste mockup, pra facilitar visualização) */
    --loop-intervalo: 6000ms;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  body {
    display: flex; align-items: center; justify-content: center;
    background: #111;
  }

  .tela-loading {
    position: relative;
    width: 100%; height: 100vh;
    background: radial-gradient(ellipse at 40% 40%, var(--bg-inner) 0%, var(--bg-outer) 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 36px;
    overflow: hidden;
  }

  /* ---- LOGO (float + glow contínuos, começam só depois da montagem) ---- */
  .logo-wrap {
    animation: logo-float 3.5s ease-in-out infinite calc(var(--t-pixels) * 1ms + 550ms),
               glow-pulse 2.8s ease-in-out infinite calc(var(--t-pixels) * 1ms + 550ms);
  }
  @keyframes logo-float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-7px); }
  }
  @keyframes glow-pulse {
    0%, 100% { filter: drop-shadow(0 0 6px rgba(59,130,246,.3)); }
    50%      { filter: drop-shadow(0 0 22px rgba(59,130,246,.8)); }
  }

  /* ---- BRACKETS (desenham as linhas ┌ e ┘) ---- */
  @keyframes draw-bracket {
    from { stroke-dashoffset: 220; }
    to   { stroke-dashoffset: 0; }
  }
  .bracket-tl, .bracket-br {
    stroke-dasharray: 220;
    stroke-dashoffset: 220;
    opacity: 0;
    animation: draw-bracket .55s cubic-bezier(.4,0,.2,1) forwards;
    animation-delay: calc(var(--t-brackets) * 1ms);
  }
  .bracket-tl { opacity: 1; }
  .bracket-br { opacity: 1; animation-delay: calc(var(--t-brackets) * 1ms + 100ms); }

  /* ---- Reveal genérico: opacidade + deslocamento ---- */
  @keyframes reveal-x {
    from { opacity: 0; transform: translateX(var(--de-x, 0)); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @keyframes reveal-y {
    from { opacity: 0; transform: translateY(var(--de-y, 0)); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .letra-j {
    opacity: 0;
    --de-x: -30px;
    animation: reveal-x .4s cubic-bezier(.34,1.56,.64,1) forwards;
    animation-delay: calc(var(--t-j) * 1ms);
  }
  .letra-a {
    opacity: 0;
    --de-y: -20px;
    animation: reveal-y .4s cubic-bezier(.34,1.56,.64,1) forwards;
    animation-delay: calc(var(--t-a) * 1ms);
  }
  .letra-v {
    opacity: 0;
    --de-x: 30px;
    animation: reveal-x .4s cubic-bezier(.34,1.56,.64,1) forwards;
    animation-delay: calc(var(--t-v) * 1ms);
  }
  @keyframes dot-pop {
    0%   { opacity: 0; transform: translateY(-12px) scale(.4); }
    60%  { transform: translateY(3px) scale(1.15); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }
  .pixel {
    opacity: 0;
    animation: dot-pop .4s cubic-bezier(.34,1.56,.64,1) both;
    animation-delay: calc(var(--t-pixels) * 1ms + var(--p-delay, 0ms));
  }

  /* ---- BARRA DE PROGRESSO ---- */
  .barra-wrap {
    width: var(--barra-largura);
    display: flex; flex-direction: column; gap: 10px;
  }
  .barra-trilho {
    width: 100%; height: 3px; border-radius: 99px; overflow: hidden;
    background: var(--bar-track);
  }
  .barra-fill {
    height: 100%; width: 0; border-radius: 99px;
    background: linear-gradient(90deg, var(--bar-1), var(--bar-2), var(--bar-3));
    box-shadow: 0 0 10px rgba(59,130,246,.7);
    animation: bar-fill var(--dur-barra) cubic-bezier(.4,0,.2,1) forwards;
    animation-delay: calc(var(--t-brackets) * 1ms);
  }
  @keyframes bar-fill {
    from { width: 0; }
    to   { width: 100%; }
  }
  .mensagem {
    text-align: center; font-size: 12px; letter-spacing: .5px;
    color: var(--texto-cor);
  }

  /* ---- Painel de controle do mockup (não existe na tela real) ---- */
  .painel-mockup {
    position: fixed; top: 16px; right: 16px; z-index: 10;
    background: rgba(255,255,255,.95); border-radius: 10px; padding: 12px 16px;
    font-size: 12px; color: #333; box-shadow: 0 4px 16px rgba(0,0,0,.25);
    max-width: 240px;
  }
  .painel-mockup b { display: block; margin-bottom: 4px; }
  .painel-mockup button {
    margin-top: 8px; padding: 6px 12px; border: none; border-radius: 6px;
    background: #3b82f6; color: white; font-weight: 700; cursor: pointer; font-size: 12px;
  }
</style>
</head>
<body>

  <div class="painel-mockup">
    <b>🧪 Mockup — Tela de Loading</b>
    Edite as variáveis CSS no topo do &lt;style&gt; (cores, tamanhos, tempos) e recarregue a página.
    <br>
    <button onclick="location.reload()">🔁 Reiniciar animação</button>
  </div>

  <div class="tela-loading" id="telaLoading">

    <!-- LOGO SVG -->
    <div class="logo-wrap">
      <svg viewBox="15 8 300 285" width="230" height="230" style="width:var(--logo-size); height:var(--logo-size);">
        <defs>
          <linearGradient id="ls-silver" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%"   stop-color="var(--silver-1)"/>
            <stop offset="40%"  stop-color="var(--silver-2)"/>
            <stop offset="100%" stop-color="var(--silver-3)"/>
          </linearGradient>
          <linearGradient id="ls-blue-v" x1="20%" y1="0%" x2="80%" y2="100%">
            <stop offset="0%"   stop-color="var(--blue-v-1)"/>
            <stop offset="100%" stop-color="var(--blue-v-2)"/>
          </linearGradient>
          <linearGradient id="ls-bracket" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%"   stop-color="var(--bracket-1)"/>
            <stop offset="100%" stop-color="var(--bracket-2)"/>
          </linearGradient>
          <linearGradient id="ls-ja-blend" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%"   stop-color="var(--ja-blend-1)"/>
            <stop offset="60%"  stop-color="var(--ja-blend-2)"/>
            <stop offset="100%" stop-color="var(--ja-blend-3)"/>
          </linearGradient>
        </defs>

        <!-- BRACKET TOP-LEFT ┌ -->
        <path class="bracket-tl"
          d="M 158,30 L 40,30 L 40,128"
          fill="none" stroke="url(#ls-bracket)" stroke-width="7" stroke-linecap="square"/>

        <!-- BRACKET BOTTOM-RIGHT ┘ -->
        <path class="bracket-br"
          d="M 160,280 L 290,280 L 290,180"
          fill="none" stroke="url(#ls-bracket)" stroke-width="7" stroke-linecap="square"/>

        <!-- LETRA J -->
        <g class="letra-j">
          <line x1="74" y1="50" x2="114" y2="50"
            stroke="url(#ls-silver)" stroke-width="13" stroke-linecap="round"/>
          <line x1="104" y1="50" x2="104" y2="215"
            stroke="url(#ls-silver)" stroke-width="22" stroke-linecap="round"/>
          <path d="M 104,215 Q 104,260 78,260 Q 58,260 58,235"
            fill="none" stroke="url(#ls-silver)" stroke-width="22" stroke-linecap="round"/>
        </g>

        <!-- PICO /\ (corpo do A) -->
        <g class="letra-a">
          <line x1="108" y1="252" x2="168" y2="50"
            stroke="url(#ls-silver)" stroke-width="22" stroke-linecap="round"/>
          <line x1="168" y1="50" x2="212" y2="165"
            stroke="url(#ls-ja-blend)" stroke-width="22" stroke-linecap="round"/>
        </g>

        <!-- LETRA V (azul) -->
        <g class="letra-v">
          <line x1="210" y1="162" x2="236" y2="252"
            stroke="url(#ls-blue-v)" stroke-width="22" stroke-linecap="round"/>
          <line x1="236" y1="252" x2="272" y2="88"
            stroke="url(#ls-blue-v)" stroke-width="22" stroke-linecap="round"/>
        </g>

        <!-- PIXELS -->
        <rect class="pixel" x="232" y="34" width="14" height="14" rx="1" fill="var(--pixel-color)" opacity="1.0" style="--p-delay:0ms"/>
        <rect class="pixel" x="249" y="22" width="10" height="10" rx="1" fill="var(--pixel-color)" opacity="0.9" style="--p-delay:80ms"/>
        <rect class="pixel" x="250" y="40" width="7"  height="7"  rx="1" fill="var(--pixel-color)" opacity="0.7" style="--p-delay:160ms"/>
        <rect class="pixel" x="238" y="50" width="5"  height="5"  rx="1" fill="var(--pixel-color)" opacity="0.5" style="--p-delay:240ms"/>
      </svg>
    </div>

    <!-- BARRA + MENSAGEM -->
    <div class="barra-wrap">
      <div class="barra-trilho">
        <div class="barra-fill"></div>
      </div>
      <div class="mensagem" id="mensagemTexto">Carregando dashboard</div>
    </div>

  </div>

</body>
</html>
